name: CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      # U+FFFD is decoding damage, never intentional text. Neither tsc, knip nor
      # eslint can see it: it is a valid string character to all three.
      - name: Check encoding
        run: npm run check:encoding

      # Unused files, exports and dependencies. Does not cover unused object
      # properties (e.g. StyleSheet keys) — knip works at module-export level.
      - name: Knip
        run: npm run knip

      - name: Test (with coverage gate)
        run: npx jest --coverage --coverageReporters=text-summary

      # database.rules.json is the sole authorization boundary for family-group
      # data and auto-deploys to the live database on a master push
      # (android-build.yml). This is the only gate that can catch a bad rule
      # before it gets there. Needs a JDK for the emulator; firebase-tools is a
      # devDependency, so npm ci already provides the CLI.
      - name: Setup Java (Firebase emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Test RTDB security rules
        run: npm run test:rules
